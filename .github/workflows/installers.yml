name: Build installers
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Install recorder dependencies
        run: npm ci
      - name: Install Chromium for Python regression tests
        run: python -m playwright install chromium
      - name: Python regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests
      - name: Build and test standalone installer
        run: python packaging/build_installers.py
      - name: Upload installers and validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoEventTracker-${{ matrix.target }}
          path: installers/*
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
